# 本地开发 / 冒烟测试用：H2 内存库，免装 MySQL 即可跑通全部接口
# 启动：java -jar target/report-bi-platform-1.0.0.jar --spring.profiles.active=dev
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:rbi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

rbi:
  test-datasource:
    driver: org.h2.Driver
    url: jdbc:h2:mem:rbi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  export:
    dir: ./export

logging:
  level:
    com.rbi: DEBUG
